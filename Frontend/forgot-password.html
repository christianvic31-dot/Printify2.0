<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Printify</title>

    <!-- Shared CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forgot-password.css">

    <!-- Page-specific CSS -->
    <style>
        .forgot-container {
            width: 100%;
            max-width: 460px;
            margin: 70px auto;
            padding: 40px;
            background: #171D19;
            border: 1px solid #29332C;
            border-radius: 18px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 28px;
            color: #9CA79F;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: #00D94F;
        }

        .forgot-icon {
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            background: rgba(0, 217, 79, 0.12);
            border: 1px solid rgba(0, 217, 79, 0.25);
            border-radius: 15px;
            font-size: 28px;
        }

        .forgot-container h1 {
            margin-bottom: 12px;
            color: #F5F7F5;
            font-size: 28px;
        }

        .forgot-description {
            margin-bottom: 28px;
            color: #9CA79F;
            font-size: 14px;
            line-height: 1.7;
        }

        .forgot-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .forgot-form label {
            display: block;
            margin-bottom: 8px;
            color: #F5F7F5;
            font-size: 14px;
            font-weight: 600;
        }

        .forgot-form input {
            width: 100%;
            padding: 13px 14px;
            color: #F5F7F5;
            background: #0B0E0B;
            border: 1px solid #29332C;
            border-radius: 9px;
            outline: none;
            font-size: 14px;
        }

        .forgot-form input:focus {
            border-color: #00D94F;
            box-shadow: 0 0 0 3px rgba(0, 217, 79, 0.1);
        }

        .forgot-form input::placeholder {
            color: #69756D;
        }

        .submit-button {
            width: 100%;
            padding: 14px;
            color: #080B09;
            background: #00D94F;
            border: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .submit-button:hover {
            background: #00B843;
            transform: translateY(-1px);
        }

        .submit-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            padding: 13px;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.6;
        }

        .message.success {
            display: block;
            color: #8EF5AE;
            background: rgba(0, 217, 79, 0.1);
            border: 1px solid rgba(0, 217, 79, 0.25);
        }

        .message.error {
            display: block;
            color: #FF9B9B;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
        }

        .login-reminder {
            margin-top: 25px;
            text-align: center;
            color: #9CA79F;
            font-size: 14px;
        }

        .login-reminder a {
            color: #00D94F;
            text-decoration: none;
            font-weight: 600;
        }

        .login-reminder a:hover {
            text-decoration: underline;
        }

        @media (max-width: 520px) {
            .forgot-container {
                margin: 30px auto;
                padding: 28px 22px;
            }

            .forgot-container h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="forgot-container">

        <a href="login.html" class="back-link">
            ← Back to Login
        </a>

        <div class="forgot-icon" aria-hidden="true">
            🔐
        </div>

        <h1>Forgot Password?</h1>

        <p class="forgot-description">
            Don't worry! Enter the email address associated with your
            Printify account. If the account is eligible for password
            recovery, instructions can be sent to your email.
        </p>

        <form id="forgotPasswordForm" class="forgot-form" novalidate>

            <div>
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your registered email"
                    autocomplete="email"
                    maxlength="254"
                    required
                >
            </div>

            <div
                id="statusMessage"
                class="message"
                role="status"
                aria-live="polite"
            ></div>

            <button type="submit" class="submit-button" id="submitButton">
                Send Reset Instructions
            </button>

        </form>

        <p class="login-reminder">
            Remember your password?
            <a href="login.html">Log in</a>
        </p>

    </main>

    <script src="js/forget-password.js"></script>

</body>
</html>
