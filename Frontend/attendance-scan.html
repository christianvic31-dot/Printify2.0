<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Record Attendance | Printify</title>
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f3f6f3;
            color: #172117;
            font-family: Arial, sans-serif;
        }
        main {
            width: min(100%, 440px);
            padding: 32px;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 12px 36px rgba(23, 33, 23, .12);
            text-align: center;
        }
        h1 { margin: 0 0 12px; font-size: 1.5rem; }
        p { margin: 0; color: #586458; line-height: 1.5; }
        #attendanceMessage { margin-top: 20px; font-weight: 700; }
        #attendanceDetails { margin-top: 10px; }
        .error { color: #b42318; }
        .success { color: #137333; }
    </style>
    <script src="js/attendance-scan.js" defer></script>
</head>
<body>
    <main>
        <h1>Printify Attendance</h1>
        <p id="attendanceMessage" role="status" aria-live="polite">Recording your attendance...</p>
        <p id="attendanceDetails"></p>
    </main>
</body>
</html>
